<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Futmondo Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="theme-color" content="#16a34a">
</head>
<body>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
      });
    }
  </script>

  <nav class="navbar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">⚽</span> Futmondo Manager</a>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}" class="nav-link {{ 'active' if request.endpoint == 'dashboard' }}">Mi plantilla</a>
      <a href="{{ url_for('market') }}" class="nav-link {{ 'active' if request.endpoint == 'market' }}">Mercado</a>
      <a href="{{ url_for('transfers') }}" class="nav-link {{ 'active' if request.endpoint == 'transfers' }}">Fichajes</a>
    </div>
  </nav>

  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, msg in messages %}
            <li class="flash flash-{{ category }}">{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
